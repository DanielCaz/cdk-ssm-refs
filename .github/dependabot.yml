version: 2

updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - DanielCaz
    # Conventional Commit titles: "chore(deps): ..." / "chore(deps-dev): ..."
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      major:
        applies-to: version-updates
        update-types:
          - major

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - DanielCaz
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      major:
        applies-to: version-updates
        update-types:
          - major
