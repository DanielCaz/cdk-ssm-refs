name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest registry definition and CDK code that shows the problem.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cdk-ssm-refs version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: cdk-version
    attributes:
      label: aws-cdk-lib and constructs versions
      placeholder: aws-cdk-lib 2.271.0, constructs 10.8.1
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js and TypeScript versions
      placeholder: Node 22.12.0, TypeScript 5.9.3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Stack traces, synth errors or CloudFormation errors, if any.
      render: shell
